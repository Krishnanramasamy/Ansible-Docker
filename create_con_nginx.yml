---
- name: Deploy real Nginx web server on container nginx_two
  hosts: docker_nodes
  gather_facts: false
  become: true

  tasks:
    - name: Remove the existing non-functional nginx_two container
      community.docker.docker_container:
        name: nginx_two
        state: absent

    - name: Launch a functional Nginx container named nginx_two
      community.docker.docker_container:
        name: nginx_two
        image: nginx:alpine
        state: started
        restart_policy: always
        published_ports:
          - "8082:80"